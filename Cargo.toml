[workspace]
resolver = "2"
members = [
    "crates/rng",
    "crates/flyvis",
    "crates/connectome",
    "crates/sim",
    "crates/codec",
    "crates/evo",
    "crates/fidelity",
    "app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Mikolaj Mikuliszyn"]
repository = "https://github.com/miki-przygoda/semblance"
homepage = "https://github.com/miki-przygoda/semblance"
keywords = ["connectome", "neuroevolution", "compression", "neuroscience"]
categories = ["science::neuroscience", "simulation"]

# Shared dependency versions. Individual crates opt in under [dependencies].
[workspace.dependencies]
semblance-rng = { path = "crates/rng", version = "0.2.0" }
semblance-flyvis = { path = "crates/flyvis", version = "0.2.0" }
semblance-connectome = { path = "crates/connectome", version = "0.2.0" }
semblance-sim = { path = "crates/sim", version = "0.2.0" }
semblance-codec = { path = "crates/codec", version = "0.2.0" }
semblance-evo = { path = "crates/evo", version = "0.2.0" }
semblance-fidelity = { path = "crates/fidelity", version = "0.2.0" }

# A release profile tuned for the tick loop / evolution inner loops.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The trace gates (crates/flyvis/src/trace_checks.rs) step the 45,669-cell,
# 1.5M-synapse network 6,800 times per 1/200 run, twice per run. Unoptimised
# that is about 17 ms a step, two minutes a test; at opt-level 3 about
# 0.9 ms, with bit-identical states. No optimisation level contracts into a
# fused multiply-add or enables fast-math, and the exact gates re-prove it on
# every run. Only the two crates doing that arithmetic are optimised; dev
# builds otherwise keep the default.
[profile.dev.package.semblance-sim]
opt-level = 3

[profile.dev.package.semblance-flyvis]
opt-level = 3
