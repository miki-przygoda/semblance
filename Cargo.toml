[workspace]
resolver = "2"
members = [
    "crates/connectome",
    "crates/sim",
    "crates/codec",
    "crates/evo",
    "crates/fidelity",
    "app",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

# Shared dependency versions. Individual crates opt in under [dependencies].
[workspace.dependencies]
semblance-connectome = { path = "crates/connectome" }
semblance-sim = { path = "crates/sim" }
semblance-codec = { path = "crates/codec" }
semblance-evo = { path = "crates/evo" }
semblance-fidelity = { path = "crates/fidelity" }
rand = "0.10"

# A release profile tuned for the tick loop / evolution inner loops.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
