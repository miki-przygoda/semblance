# Every flyvis acceptance gate, with fixtures present and verified.
# Design: docs/superpowers/specs/2026-10-01-ci-design.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after checkout uses git with credentials; the fixture
          # fetch passes GH_TOKEN to gh directly.
          persist-credentials: false

      # Pinned, not stable: with -D warnings a new stable lint would turn CI
      # red with no change in the repo. Bumping this is a deliberate edit.
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal --component clippy
          rustup override set 1.97

      # `target` is not cached (spec P4): a fresh checkout makes every path
      # dependency dirty, and every shadow test re-copies its sources, so a
      # restored target never saved a build and its upload cost 25 s.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-1.97-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-1.97-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-

      # The whole fixture set, keyed exactly on the manifest and the tag, with
      # no restore-keys: a key change always starts clean, because stale
      # restored files would be refused by fetch-fixtures.sh's never-overwrite
      # rule. The fetch step re-verifies every restored file, so the cache only
      # ever saves a download. Restore and save are separate steps so a run
      # whose tests fail still saves a verified set.
      #
      # The Save step's paths must equal these, in this order: the cache
      # version is computed from them.
      #
      # A bad entry fails every run that restores it, at the fetch step, naming
      # the file. Recover by deleting the entry (`gh cache list --key fixtures-`
      # to find it, `gh cache delete <key>` to remove it) and re-running.
      - name: Restore fixtures
        id: fixtures-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/flyvis-supplementary/Lappalainen_et_al_connectome_avg_filters.json
            data/flyvis-build
            data/flyvis-stimuli
            data/flyvis-reference
            data/flyvis-pretrained/ensemble.csv
          key: fixtures-${{ hashFiles('ci/fixtures.sha256', 'ci/fixtures-tag') }}

      - name: Fetch and verify fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/fetch-fixtures.sh

      # continue-on-error is deliberate: a failed save (say, a concurrent run
      # already reserved the key) only costs a download on the next run.
      # Correctness rests on the fetch step's verification, never on the cache.
      - name: Save fixtures
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/flyvis-supplementary/Lappalainen_et_al_connectome_avg_filters.json
            data/flyvis-build
            data/flyvis-stimuli
            data/flyvis-reference
            data/flyvis-pretrained/ensemble.csv
          key: ${{ steps.fixtures-cache.outputs.cache-primary-key }}

      - name: Build
        run: cargo build --workspace

      # The app package (`semblance`: validate, the record and their
      # acceptance tests) runs in the acceptance job, in parallel: its tests
      # run validate in full several times, which alone would take this job
      # past its timeout. The two jobs' test steps together cover the
      # workspace.
      - name: Test, with every fixture required
        env:
          SEMBLANCE_REQUIRE_FIXTURES: "1"
        run: cargo test --workspace --exclude semblance

      # The geometry gate exists to be read, not just passed. Its table in the
      # log is also the evidence that the fixture gates ran rather than skipped.
      # --exact plus a required "1 passed": a rename must fail here, not
      # quietly match zero tests.
      - name: Moving-edge gate distribution
        shell: bash
        env:
          SEMBLANCE_REQUIRE_FIXTURES: "1"
        run: |
          cargo test -p semblance-flyvis -- --exact --nocapture \
            moving_edge_checks::moving_edge_offsets_match_flyvis_within_tolerance \
            | tee moving-edge.log
          grep -q '1 passed' moving-edge.log

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Lossless means exactly zero, matched as a literal string.
      - name: Roundtrip is lossless
        run: |
          out="$(cargo run --quiet -- roundtrip)"
          echo "$out"
          grep -qF 'structural distance:  0.000000' <<<"$out"
          grep -qF 'behavioural distance: 0.000000' <<<"$out"

  # The app package's tests, the record test among them, and the step that
  # writes the record's generated block. Split from `test` only for time.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # As in the test job.
          persist-credentials: false

      # The test job's pinned toolchain; bump both together.
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97 --profile minimal
          rustup override set 1.97

      # As in the test job: `target` is not cached (spec P4).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-1.97-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-1.97-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-

      # The same fixtures and verification as the test job's (see there).
      - name: Restore fixtures
        id: fixtures-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/flyvis-supplementary/Lappalainen_et_al_connectome_avg_filters.json
            data/flyvis-build
            data/flyvis-stimuli
            data/flyvis-reference
            data/flyvis-pretrained/ensemble.csv
          key: fixtures-${{ hashFiles('ci/fixtures.sha256', 'ci/fixtures-tag') }}

      - name: Fetch and verify fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/fetch-fixtures.sh

      - name: Build
        run: cargo build --workspace

      # The record's generated block, produced on this host (spec R9). The head
      # commits it from this artifact; nothing else generates the record.
      # A gate failure here fails the job; the upload still runs so the
      # output can be read.
      - name: Validate, writing the record's generated block
        run: target/debug/semblance validate --markdown > parity-record.md

      - name: Upload the record's generated block
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-record
          path: parity-record.md
          if-no-files-found: error

      # SEMBLANCE_REQUIRE_LIBM_RECORD: this host recorded the record, so its
      # libm section must match byte for byte, not be skipped.
      - name: Test, with every fixture required
        env:
          SEMBLANCE_REQUIRE_FIXTURES: "1"
          SEMBLANCE_REQUIRE_LIBM_RECORD: "1"
        run: cargo test -p semblance

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after checkout uses git with credentials.
          persist-credentials: false

      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup override set 1.85

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-1.85-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-1.85-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-

      - name: Build on the declared rust-version
        run: cargo build --workspace --all-targets
